[package]
name = "vroom-win"
description = "Vroom for Windows: tray app, recorder and library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vroom-app"
path = "src/main.rs"

# Everything is Windows-only; on other systems the binary just says so, so the
# workspace still builds and tests on macOS.
[target.'cfg(windows)'.dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.37.0", features = ["file", "image"] }
global-hotkey = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde.workspace = true
serde_json.workspace = true
tray-icon = "0.26.1"
vroom-core.workspace = true
windows-capture = "2.0.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
