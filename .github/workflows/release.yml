name: Release

# Push a tag matching the Cargo version (e.g. v0.1.0) to build and publish the
# Mac app, the CLI for macOS and Windows, and checksums.
on:
  push:
    tags: ["v*"]

# Build jobs run dependency code, so they only read; publishing writes.
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Tag must match the Cargo version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match Cargo version v$version" >&2
            exit 1
          fi
      - name: Test
        run: |
          cargo test --locked
          (cd app && swift run -c debug KitChecks)
      # Built without any secret: dependency build scripts run here. The app is ad-hoc
      # signed and gets its release signature in the sign-macos job.
      - name: Package
        env:
          VROOM_SIGN_IDENTITY: "-"
        run: scripts/package-release.sh
      - name: Smoke-test the packaged CLI
        run: |
          mkdir -p /tmp/smoke && tar -xzf dist/vroom-macos-arm64.tar.gz -C /tmp/smoke
          /tmp/smoke/vroom/vroom --json version | grep -q '"protocol"'
          bash -n scripts/get.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-unsigned
          path: dist/*

  # Signs the app with the stable "Vroom Release Signing" certificate. It keeps the
  # designated requirement the same from release to release, so macOS keeps Vroom's
  # Screen Recording, camera and microphone permissions when the app updates itself.
  # This job builds and runs no project or dependency code: it only holds the key
  # while codesign runs, and the key is imported non-extractable.
  sign-macos:
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: app/Vroom.entitlements
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-unsigned
          path: dist
      - name: Import the code signing identity
        env:
          P12: ${{ secrets.VROOM_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.VROOM_SIGNING_P12_PASSWORD }}
        run: |
          test -n "$P12" && test -n "$P12_PASSWORD" || { echo "VROOM_SIGNING_P12(_PASSWORD) secrets are missing" >&2; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 900 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          printf %s "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -x -T /usr/bin/codesign >/dev/null
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S codesign: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
      - name: Sign
        run: |
          cd dist
          ditto -x -k Vroom-macos-arm64.zip unpacked
          app=unpacked/Vroom.app
          codesign --force --options runtime --sign "Vroom Release Signing" "$app/Contents/Resources/vroom"
          codesign --force --options runtime --entitlements ../app/Vroom.entitlements --sign "Vroom Release Signing" "$app"
          codesign --verify --deep --strict "$app"
          codesign -dr - "$app" 2>&1 | grep -q 'certificate leaf' \
            || { echo "Vroom.app is not signed with the release identity" >&2; exit 1; }
          rm Vroom-macos-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent "$app" Vroom-macos-arm64.zip
          rm -rf unpacked
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked -p vroom -p vroom-win
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/vroom | Out-Null
          Copy-Item target/release/vroom.exe, LICENSE dist/vroom/
          Copy-Item target/release/vroom-app.exe dist/vroom/Vroom.exe
          & dist/vroom/vroom.exe --json version
          Compress-Archive -Path dist/vroom -DestinationPath dist/vroom-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/vroom-windows-x64.zip

  publish:
    needs: [sign-macos, windows]
    # macOS, for CryptoKit: scripts/sign-update.swift signs the checksums.
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist
      # Lets anyone check that the downloads were built here, from this repo:
      # gh attestation verify <file> --repo estevecastells/vroom
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Vroom-macos-arm64.zip
            dist/vroom-macos-arm64.tar.gz
            dist/vroom-windows-x64.zip
      - name: Checksums and update signature
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          cd dist
          shasum -a 256 Vroom-macos-arm64.zip vroom-macos-arm64.tar.gz vroom-windows-x64.zip > SHA256SUMS
          swift ../scripts/sign-update.swift SHA256SUMS > SHA256SUMS.sig
          # The in-app updater refuses unsigned releases, so never publish one.
          test -s SHA256SUMS.sig
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat > NOTES.md <<'NOTES'
          ## Install on a Mac (Apple Silicon, macOS 14+)

          ```sh
          curl -fsSL https://raw.githubusercontent.com/estevecastells/vroom/main/scripts/get.sh | bash
          ```

          Or download `Vroom-macos-arm64.zip`. The app is not notarized: if macOS refuses to open it,
          go to System Settings › Privacy & Security and press **Open Anyway**.

          Once installed, Vroom updates itself (Settings › Recording), never in the middle of a
          recording, upload or transcription.

          ## Windows

          `vroom-windows-x64.zip` holds the `vroom` CLI: library, R2 uploads, share links, restore and
          the Loom importer. There is no Windows recorder yet.
          NOTES
          gh release create "$TAG" Vroom-macos-arm64.zip vroom-macos-arm64.tar.gz vroom-windows-x64.zip SHA256SUMS SHA256SUMS.sig \
            --title "Vroom $TAG" --notes-file NOTES.md --generate-notes --verify-tag
