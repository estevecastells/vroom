[workspace]
resolver = "2"
members = ["crates/vroom-core", "crates/vroom-cloud", "crates/vroom"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/estevecastells/vroom"
homepage = "https://github.com/estevecastells/vroom"

[workspace.dependencies]
vroom-core = { path = "crates/vroom-core" }
vroom-cloud = { path = "crates/vroom-cloud" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
